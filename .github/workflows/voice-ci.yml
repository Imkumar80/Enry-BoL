name: Voice Pipeline CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q voice agent tts db.py app.py
